name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  notarized-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and scripts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          source script/release_contract.sh
          copyclip_require_release_version "$VERSION" "Release tag version"
          echo "COPYCLIP_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          bash -n script/*.sh script/tests/*.sh

      - name: Verify release contract
        run: bash script/tests/task_018_release_harness.sh

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/copyclip.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Configure notarization profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials CopyClipLiteNotary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD"

      - name: Test
        run: |
          swift test
          swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build, sign, notarize, and staple
        run: |
          IDENTITY="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$IDENTITY"
          COPYCLIP_RELEASE_MODE=distribution \
          COPYCLIP_CODESIGN_IDENTITY="$IDENTITY" \
          COPYCLIP_NOTARY_PROFILE=CopyClipLiteNotary \
          COPYCLIP_VERSION="$COPYCLIP_RELEASE_VERSION" \
          COPYCLIP_EXPECTED_VERSION="$COPYCLIP_RELEASE_VERSION" \
          COPYCLIP_BUILD_NUMBER="${{ github.run_number }}" \
          COPYCLIP_UPDATE_FEED_URL="https://api.github.com/repos/38st/CopyClipLite/releases/latest" \
          ./script/package_release.sh

      - name: Record verified artifact checksum
        run: shasum -a 256 dist/CopyClip-Lite-macOS.zip | tee dist/CopyClip-Lite-macOS.zip.sha256

      - name: Create draft GitHub release
        id: draft_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/CopyClip-Lite-macOS.zip \
            dist/CopyClip-Lite-macOS.zip.sha256 \
            --draft \
            --generate-notes \
            --verify-tag
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Verify uploaded release asset checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DOWNLOAD_DIR="$(mktemp -d "$RUNNER_TEMP/copyclip-release-download.XXXXXX")"
          trap 'rm -rf "$DOWNLOAD_DIR"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --pattern "CopyClip-Lite-macOS.zip" \
            --dir "$DOWNLOAD_DIR"
          EXPECTED_SHA256="$(awk '{print $1}' dist/CopyClip-Lite-macOS.zip.sha256)"
          DOWNLOADED_SHA256="$(shasum -a 256 "$DOWNLOAD_DIR/CopyClip-Lite-macOS.zip" | awk '{print $1}')"
          test "$DOWNLOADED_SHA256" = "$EXPECTED_SHA256"

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Remove failed draft release
        if: ${{ failure() && steps.draft_release.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$GITHUB_REF_NAME" --yes
