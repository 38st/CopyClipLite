name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  ad-hoc-release:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and scripts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          source script/release_contract.sh
          copyclip_require_release_version "$VERSION" "Release tag version"
          echo "COPYCLIP_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          bash -n script/*.sh script/tests/*.sh

      - name: Verify release contract
        run: bash script/tests/release_contract_harness.sh

      - name: Run installer process harness
        run: ./script/tests/installer_process_harness.sh

      - name: Test
        run: |
          ./script/check_coverage.sh
          swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build and verify ad-hoc release
        run: |
          COPYCLIP_RELEASE_MODE=local \
          COPYCLIP_CODESIGN_IDENTITY=- \
          COPYCLIP_VERSION="$COPYCLIP_RELEASE_VERSION" \
          COPYCLIP_EXPECTED_VERSION="$COPYCLIP_RELEASE_VERSION" \
          COPYCLIP_BUILD_NUMBER="${{ github.run_number }}" \
          COPYCLIP_UPDATE_FEED_URL="https://api.github.com/repos/38st/CopyClipLite/releases/latest" \
          ./script/package_release.sh

      - name: Record verified artifact checksum
        run: shasum -a 256 dist/CopyClip-Lite-macOS.zip | tee dist/CopyClip-Lite-macOS.zip.sha256

      - name: Create draft GitHub release
        id: draft_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## macOS installation note

          This build is ad-hoc signed and not notarized because the project does not use an Apple Developer Program account. macOS Gatekeeper may require Control-clicking the app, choosing Open, and confirming the launch.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            dist/CopyClip-Lite-macOS.zip \
            dist/CopyClip-Lite-macOS.zip.sha256 \
            --draft \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Verify uploaded release asset checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DOWNLOAD_DIR="$(mktemp -d "$RUNNER_TEMP/copyclip-release-download.XXXXXX")"
          trap 'rm -rf "$DOWNLOAD_DIR"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --pattern "CopyClip-Lite-macOS.zip" \
            --dir "$DOWNLOAD_DIR"
          EXPECTED_SHA256="$(awk '{print $1}' dist/CopyClip-Lite-macOS.zip.sha256)"
          DOWNLOADED_SHA256="$(shasum -a 256 "$DOWNLOAD_DIR/CopyClip-Lite-macOS.zip" | awk '{print $1}')"
          test "$DOWNLOADED_SHA256" = "$EXPECTED_SHA256"

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Remove failed draft release
        if: ${{ failure() && steps.draft_release.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$GITHUB_REF_NAME" --yes
